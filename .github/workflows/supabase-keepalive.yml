# ─────────────────────────────────────────────────────────────────────────────
# Supabase keep-alive
# Hace una query inocua al proyecto Supabase de TravelMind cada 4 días.
# Sirve para evitar que Supabase pause el proyecto del plan free por
# "inactividad" cuando el dueño no entra a la app durante muchos días.
#
# Si el ping falla (proyecto pausado, token cambiado, etc.) el job aparece
# en rojo en la pestaña Actions del repo y GitHub envía email automatico.
# ─────────────────────────────────────────────────────────────────────────────
name: Supabase keep-alive

on:
  schedule:
    # Cada 4 dias a las 06:00 UTC. Free de GitHub Actions tiene de sobra.
    - cron: '0 6 */4 * *'
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query inocua a Supabase
        env:
          SUPABASE_URL: https://ghlfzvneoyjychkqmroj.supabase.co
          # Anon key — ya viaja en el bundle público de la PWA, no es secreto.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdobGZ6dm5lb3lqeWNoa3Ftcm9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NDQwMjYsImV4cCI6MjA5MTAyMDAyNn0.VsqRmQmB5_swuVGKRtqNUC5eiDbfWfeNYfQUBTMkNkM
        run: |
          set -eu
          STATUS=$(curl -sS -o /tmp/body -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/future_destinations?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP $STATUS"
          echo "Body:"
          head -c 500 /tmp/body || true
          echo ""

          # 200 = OK. 401/403 = key invalida o RLS bloquea. 5xx = upstream caido.
          # Aceptamos 2xx como exito.
          if [ "${STATUS%??}" != "2" ]; then
            echo "::error::Ping fallido (HTTP $STATUS). Revisar Supabase y/o anon key."
            exit 1
          fi

          echo "::notice::Ping OK — proyecto Supabase reseteado."
